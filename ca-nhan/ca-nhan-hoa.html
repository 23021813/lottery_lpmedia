<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cá Nhân Hóa Dịch Vụ - MSB</title>

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Khung bao toàn màn hình -->
  <main class="stage-wrapper">

    <!-- Sân khấu hiển thị tỷ lệ chuẩn màn hình LED 1535x576 -->
    <div class="stage stage-detail" id="screenStage">

      <!-- KHỐI TIÊU ĐỀ BÊN TRÊN Ở GIỮA -->
      <header class="detail-heading">
        <h1 class="main-title">
          <span>CÁ NHÂN HÓA DỊCH VỤ</span>
        </h1>
        <div class="divider-line" aria-hidden="true"></div>
        <p class="sub-title">Cung cấp trải nghiệm cá nhân hóa</p>
      </header>

      <!-- KHỐI 2 THẺ TÍNH NĂNG Ở GIỮA -->
      <section class="detail-cards-container" aria-label="Các tùy chọn cá nhân hóa">

        <!-- Thẻ 1: Đa dạng giao diện -->
        <article class="detail-card" tabindex="0">
          <div class="detail-card-icon">
            <img src="images/icon-gallery-3d.png" alt="Đa dạng giao diện" class="img-icon-3d">
          </div>
          <div class="detail-card-body">
            <p class="detail-card-desc">
              Đa dạng giao diện,<br>
              cá nhân hóa<br>
              theo từng phong cách
            </p>
          </div>
        </article>

        <!-- Thẻ 2: Bộ theme riêng M-first -->
        <article class="detail-card" tabindex="0">
          <div class="detail-card-icon">
            <img src="images/icon-theme-3d.png" alt="Bộ theme riêng" class="img-icon-3d">
          </div>
          <div class="detail-card-body">
            <p class="detail-card-desc">
              Bộ theme riêng<br>
              dành cho<br>
              khách hàng M-first
            </p>
          </div>
        </article>

      </section>

      <!-- KHỐI ĐIỀU HƯỚNG & NÚT BẤM DƯỚI CÙNG -->
      <footer class="detail-action-container">
        <div class="chevron-indicator" aria-hidden="true">
          <img src="images/icon-chevron-down.svg" alt="" class="icon-down">
        </div>
        <a href="#" class="btn-cta" role="button">
          Thay đổi giao diện
        </a>
      </footer>

    </div>

  </main>

</body>

</html>
