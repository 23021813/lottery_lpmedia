<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MSB - Quay Số Trúng Thưởng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
         MSB BRAND COLORS (CHỈ DÙNG CAM - ĐỎ MSB) & LIQUID GLASS 3D
         ============================================================ */
      :root {
        /* Bảng màu thương hiệu MSB */
        --color-msb-orange: #f37021; /* Cam tươi rực rỡ MSB (Chủ đạo) */
        --color-msb-primary: #ef4123; /* Đỏ cam nhận diện MSB */
        --color-msb-red: #ed1c24; /* Đỏ cờ MSB */
        --color-msb-dark: #9e0b0f; /* Đỏ sẫm chiều sâu */
        --color-white-pure: #ffffff; /* Trắng pha lê phản quang */

        /* Nền vũ trụ sâu thẳm */
        --color-bg-space: #060309;

        /* Kính lỏng siêu trong suốt & bóng pha lê (iOS / visionOS Liquid Glass) */
        --liquid-glass-bg: rgba(255, 255, 255, 0.03);
        --liquid-glass-bg-hover: rgba(255, 255, 255, 0.06);
        --liquid-glass-blur: blur(45px) saturate(220%) contrast(112%);

        /* Đa tầng bóng đổ khúc xạ giọt nước nổi khối 3D */
        --water-drop-shadow: 
          inset 2px 2px 4px 0 rgba(255, 255, 255, 0.8),
          inset -2px -2px 4px 0 rgba(0, 0, 0, 0.7),
          inset 0 20px 40px -10px rgba(255, 255, 255, 0.18),
          inset 0 -20px 40px -10px rgba(158, 11, 15, 0.4),
          0 35px 80px -10px rgba(0, 0, 0, 0.92),
          0 15px 35px rgba(0, 0, 0, 0.65),
          0 0 85px -5px rgba(243, 112, 33, 0.65);

        --font-sans: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        background-color: #000000;
        font-family: var(--font-sans);
        color: #ffffff;
        user-select: none;
      }

      /* Video nền động sân khấu sự kiện MSB - Background duy nhất */
      .bg-video-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
        background-color: #000000;
      }

      .bg-video-element {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
      }

      /* Bỏ hoàn toàn lớp phủ gradient để video hiển thị nguyên bản sắc nét */
      body::before {
        display: none !important;
      }

      /* Bỏ hoàn toàn canvas sao băng rơi & hạt vũ trụ */
      #cosmosCanvas {
        display: none !important;
      }

      /* Canvas ăn mừng khi có người trúng giải */
      #celebrationCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 50;
        pointer-events: none;
      }

      /* Khung sân khấu chính */
      .lottery-stage {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        gap: 20px;
      }

      /* ============================================================
         LIQUID GLASS DROPDOWN (GIỌT NƯỚC PILL THỦY TINH 3D)
         ============================================================ */
      .prize-dropdown-wrapper {
        position: relative;
        z-index: 30;
      }

      .prize-dropdown-trigger {
        position: relative;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 13px 28px;
        background: var(--liquid-glass-bg);
        backdrop-filter: var(--liquid-glass-blur);
        -webkit-backdrop-filter: var(--liquid-glass-blur);
        border-radius: 9999px;
        border: 1px solid transparent;
        background-clip: padding-box;
        box-shadow: 
          inset 1.8px 1.8px 3px 0 rgba(255, 255, 255, 0.85),
          inset -1.8px -1.8px 3px 0 rgba(0, 0, 0, 0.55),
          inset 0 12px 24px rgba(255, 255, 255, 0.15),
          0 14px 40px rgba(0, 0, 0, 0.55),
          0 0 40px rgba(243, 112, 33, 0.45);
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Viền lăng kính lỏng (Prismatic Edge) */
      .prize-dropdown-trigger::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.75) 0%,
          rgba(243, 112, 33, 0.5) 45%,
          rgba(239, 65, 35, 0.3) 100%
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      /* Đốm sáng phản chiếu thấu kính lồi */
      .prize-dropdown-trigger::after {
        content: "";
        position: absolute;
        top: 1px;
        left: 20%;
        right: 20%;
        height: 45%;
        border-radius: 9999px 9999px 0 0;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.35) 0%,
          transparent 100%
        );
        pointer-events: none;
      }

      .prize-dropdown-trigger:hover {
        background: var(--liquid-glass-bg-hover);
        transform: translateY(-1px);
        box-shadow: 
          inset 1.8px 1.8px 3px 0 rgba(255, 255, 255, 0.95),
          inset -1.8px -1.8px 3px 0 rgba(0, 0, 0, 0.55),
          0 18px 46px rgba(243, 112, 33, 0.4),
          0 0 55px rgba(243, 112, 33, 0.65);
      }

      .prize-dropdown-trigger:active {
        transform: translateY(0) scale(0.98);
      }

      .prize-badge-indicator {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background-color: var(--color-msb-orange);
        box-shadow: 0 0 16px var(--color-msb-orange), 0 0 8px #ffffff;
        flex-shrink: 0;
      }

      .prize-title-display {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #ffffff;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }

      /* Badge hiển thị số lượng giải: Chỉ hiện khi >= 1 giải */
      .prize-count-tag {
        display: none; /* Mặc định ẩn khi 0 giải */
        font-size: 13px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(243, 112, 33, 0.22);
        padding: 3px 12px;
        border-radius: 9999px;
        border: 1px solid rgba(243, 112, 33, 0.45);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .prize-count-tag:hover {
        background: rgba(243, 112, 33, 0.4);
        border-color: rgba(243, 112, 33, 0.7);
        transform: scale(1.05);
      }

      .prize-dropdown-chevron {
        width: 9px;
        height: 9px;
        border-right: 2px solid rgba(255, 255, 255, 0.85);
        border-bottom: 2px solid rgba(255, 255, 255, 0.85);
        transform: rotate(45deg) translateY(-2px);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        margin-left: 4px;
      }

      .prize-dropdown-wrapper.is-open .prize-dropdown-chevron {
        transform: rotate(-135deg) translateY(-2px);
      }

      /* Dropdown Menu (Khối Thủy Tinh Giọt Nước Siêu Trong) */
      .prize-dropdown-menu {
        position: absolute;
        top: calc(100% + 12px);
        left: 50%;
        transform: translateX(-50%) translateY(-10px) scale(0.96);
        min-width: 340px;
        background: rgba(18, 10, 24, 0.82);
        backdrop-filter: blur(50px);
        -webkit-backdrop-filter: blur(50px);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 24px;
        padding: 10px;
        box-shadow: 
          inset 1.8px 1.8px 3px 0 rgba(255, 255, 255, 0.5),
          0 30px 80px rgba(0, 0, 0, 0.85),
          0 0 60px rgba(243, 112, 33, 0.35);
        opacity: 0;
        pointer-events: none;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .prize-dropdown-wrapper.is-open .prize-dropdown-menu {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0) scale(1);
      }

      .prize-option-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 20px;
        border-radius: 16px;
        background: transparent;
        border: 1px solid transparent;
        color: rgba(255, 255, 255, 0.85);
        cursor: pointer;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-align: left;
        transition: all 0.2s ease;
      }

      .prize-option-item:hover {
        background: rgba(255, 255, 255, 0.09);
        color: #ffffff;
      }

      .prize-option-item.is-selected {
        background: rgba(243, 112, 33, 0.22);
        color: #ffaa80;
        border-color: rgba(243, 112, 33, 0.45);
      }

      /* Option count badge: Ẩn khi 0 giải, hiện khi >= 1 giải */
      .prize-option-count {
        display: none;
        font-size: 12px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(243, 112, 33, 0.25);
        border: 1px solid rgba(243, 112, 33, 0.45);
        padding: 2px 9px;
        border-radius: 9999px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .prize-option-count:hover {
        background: rgba(243, 112, 33, 0.5);
        color: #ffffff;
        transform: scale(1.08);
      }

      /* ============================================================
         SLOT MACHINE (KHỐI THỦY TINH GIỌT NƯỚC NỔI 3D CHUẨN iOS)
         ============================================================ */
      .slot-machine-container {
        position: relative;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 36px;
        background: var(--liquid-glass-bg);
        backdrop-filter: var(--liquid-glass-blur);
        -webkit-backdrop-filter: var(--liquid-glass-blur);
        border-radius: 36px;
        border: 1px solid transparent;
        background-clip: padding-box;
        box-shadow: var(--water-drop-shadow);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        cursor: pointer;
      }

      /* Viền lăng kính giọt nước phát sáng */
      .slot-machine-container::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1.5px;
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.85) 0%,
          rgba(243, 112, 33, 0.5) 40%,
          rgba(239, 65, 35, 0.3) 75%,
          rgba(255, 255, 255, 0.45) 100%
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      /* Đốm sáng phản chiếu thấu kính cong */
      .slot-machine-container::after {
        content: "";
        position: absolute;
        top: 0;
        left: 8%;
        right: 8%;
        height: 38%;
        border-radius: 40px 40px 0 0;
        background: radial-gradient(
          ellipse at 50% 0%,
          rgba(255, 255, 255, 0.45) 0%,
          rgba(255, 255, 255, 0.1) 45%,
          transparent 75%
        );
        pointer-events: none;
      }

      .slot-machine-container:hover {
        box-shadow: 
          inset 2.5px 2.5px 6px 0 rgba(255, 255, 255, 0.95),
          inset -2.5px -2.5px 6px 0 rgba(0, 0, 0, 0.7),
          inset 0 25px 45px -10px rgba(255, 255, 255, 0.25),
          0 40px 95px -10px rgba(0, 0, 0, 0.98),
          0 0 100px -5px rgba(243, 112, 33, 0.8);
      }

      .slot-machine-container.is-spinning {
        box-shadow: 
          inset 2.5px 2.5px 6px 0 rgba(255, 255, 255, 0.95),
          inset -2.5px -2.5px 6px 0 rgba(0, 0, 0, 0.7),
          0 40px 105px -10px rgba(0, 0, 0, 0.98),
          0 0 115px rgba(243, 112, 33, 0.9);
      }

      .slot-machine-container.is-celebrating {
        animation: celebrateScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 
          inset 2.5px 2.5px 6px 0 rgba(255, 255, 255, 0.95),
          inset -2.5px -2.5px 6px 0 rgba(0, 0, 0, 0.7),
          0 40px 115px -10px rgba(0, 0, 0, 0.98),
          0 0 130px rgba(243, 112, 33, 0.95);
      }

      @keyframes celebrateScale {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.03);
        }
        100% {
          transform: scale(1);
        }
      }

      /* Lưới 4 ô số */
      .slot-grid {
        display: flex;
        gap: 28px;
        align-items: center;
      }

      /* Từng ô số: THẤU KÍNH 3D RIÊNG BIỆT (KHÔNG CÓ GẠCH NGANG CHIA CẮT SỐ) */
      .slot-cell {
        position: relative;
        width: 230px;
        height: 290px;
        background: rgba(10, 4, 16, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 
          inset 0 4px 15px rgba(0, 0, 0, 0.85),
          inset 0 -2px 6px rgba(255, 255, 255, 0.18),
          0 4px 12px rgba(0, 0, 0, 0.4);
        box-sizing: border-box;
        perspective: 800px;
        transform-style: preserve-3d;
        will-change: transform;
        transition: transform 0.25s ease-out;
      }

      /* Lớp bóng vòm mặt kính ô số (BỎ đường line gạch ngang ở giữa) */
      .slot-cell::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 48%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.18) 0%,
          rgba(255, 255, 255, 0.01) 100%
        );
        pointer-events: none;
        border-top-left-radius: 27px;
        border-top-right-radius: 27px;
        z-index: 6;
      }

      /* Dải chữ số cuộn (Điều khiển 100% bằng JavaScript, KHÔNG transition) */
      .digit-strip {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        will-change: transform;
      }

      /* Từng con số: THỦY TINH LỎNG SIÊU SẮC NÉT (KHÔNG BLUR, CHỈ DÙNG CAM - ĐỎ MSB) */
      .digit-item {
        width: 100%;
        height: 290px;
        line-height: 290px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 175px;
        font-weight: 800;
        font-feature-settings: "tnum";
        font-variant-numeric: tabular-nums;
        box-sizing: border-box;
        
        /* Hiệu ứng chữ thủy tinh lỏng ánh cam MSB (KHÔNG DÙNG VÀNG) */
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #ffe5d9 30%,
          #f37021 75%,
          #ef4123 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.95))
          drop-shadow(0 0 18px rgba(243, 112, 33, 0.55));
      }

      /* Khi số dừng khóa kết quả: Báo hiệu trúng giải bằng hiệu ứng Liquid Glass Cam Đỏ MSB */
      .slot-cell.is-locked {
        background: radial-gradient(
          circle at 50% 30%,
          rgba(243, 112, 33, 0.28) 0%,
          rgba(239, 65, 35, 0.16) 50%,
          rgba(10, 4, 16, 0.75) 100%
        );
        border: 1.5px solid rgba(243, 112, 33, 0.85);
        box-shadow: 
          inset 2px 2px 5px 0 rgba(255, 255, 255, 0.75),
          inset -2px -2px 5px 0 rgba(0, 0, 0, 0.65),
          inset 0 0 30px rgba(243, 112, 33, 0.45),
          0 8px 30px rgba(0, 0, 0, 0.7),
          0 0 50px rgba(243, 112, 33, 0.75),
          0 0 90px rgba(239, 65, 35, 0.5);
        transform: scale(1.03);
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Lớp bóng vòm thấu kính trên ô số khi trúng giải */
      .slot-cell.is-locked::after {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.4) 0%,
          rgba(243, 112, 33, 0.2) 50%,
          transparent 100%
        );
      }

      /* Chữ số trúng giải: THỦY TINH LỎNG SẮC CAM ĐỎ MSB RỰC RỠ (KHÔNG BỊ TRẮNG) */
      .slot-cell.is-locked .digit-item {
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #ffe3d1 15%,
          #f37021 48%,
          #ef4123 78%,
          #ed1c24 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.95))
          drop-shadow(0 0 28px rgba(243, 112, 33, 0.95))
          drop-shadow(0 0 55px rgba(239, 65, 35, 0.85))
          drop-shadow(0 0 95px rgba(237, 28, 36, 0.65));
        transition: all 0.35s ease;
      }

      /* Nút Điều Khiển Quay Số: Liquid Glass 3D MSB */
      .lottery-control-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-width: 250px;
        padding: 16px 48px;
        background: linear-gradient(
          135deg,
          rgba(243, 112, 33, 0.92) 0%,
          rgba(239, 65, 35, 0.96) 100%
        );
        backdrop-filter: var(--liquid-glass-blur);
        -webkit-backdrop-filter: var(--liquid-glass-blur);
        border: 1.5px solid rgba(255, 255, 255, 0.45);
        border-radius: 9999px;
        font-family: inherit;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #ffffff;
        cursor: pointer;
        box-shadow: 
          inset 2px 2px 4px rgba(255, 255, 255, 0.8),
          inset -2px -2px 4px rgba(0, 0, 0, 0.4),
          inset 0 12px 24px rgba(255, 255, 255, 0.2),
          0 15px 35px rgba(0, 0, 0, 0.6),
          0 0 50px rgba(243, 112, 33, 0.65);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
        user-select: none;
        z-index: 25;
      }

      .lottery-control-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: 10%;
        right: 10%;
        height: 48%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.65) 0%,
          transparent 100%
        );
        border-radius: 9999px 9999px 0 0;
        pointer-events: none;
      }

      .lottery-control-btn:hover {
        transform: translateY(-2px) scale(1.04);
        box-shadow: 
          inset 2px 2px 4px rgba(255, 255, 255, 0.95),
          inset -2px -2px 4px rgba(0, 0, 0, 0.3),
          0 20px 45px rgba(0, 0, 0, 0.7),
          0 0 70px rgba(243, 112, 33, 0.85);
        filter: brightness(1.1);
      }

      .lottery-control-btn:active {
        transform: translateY(1px) scale(0.98);
        box-shadow: 
          inset 2px 2px 5px rgba(0, 0, 0, 0.6),
          0 8px 20px rgba(0, 0, 0, 0.5),
          0 0 30px rgba(243, 112, 33, 0.5);
      }

      /* Trạng thái Đang Quay -> DỪNG LẠI */
      .lottery-control-btn.is-spinning {
        background: linear-gradient(
          135deg,
          rgba(237, 28, 36, 0.92) 0%,
          rgba(158, 11, 15, 0.96) 100%
        );
        border-color: rgba(255, 255, 255, 0.55);
        box-shadow: 
          inset 2px 2px 4px rgba(255, 255, 255, 0.8),
          inset -2px -2px 4px rgba(0, 0, 0, 0.5),
          0 15px 35px rgba(0, 0, 0, 0.7),
          0 0 60px rgba(237, 28, 36, 0.75);
        animation: pulseStopBtn 1.5s infinite alternate ease-in-out;
      }

      @keyframes pulseStopBtn {
        0% {
          box-shadow: 
            inset 2px 2px 4px rgba(255, 255, 255, 0.8),
            inset -2px -2px 4px rgba(0, 0, 0, 0.5),
            0 15px 35px rgba(0, 0, 0, 0.7),
            0 0 45px rgba(237, 28, 36, 0.6);
        }
        100% {
          box-shadow: 
            inset 2px 2px 4px rgba(255, 255, 255, 0.9),
            inset -2px -2px 4px rgba(0, 0, 0, 0.5),
            0 20px 45px rgba(0, 0, 0, 0.8),
            0 0 80px rgba(237, 28, 36, 0.95);
        }
      }

      /* Trạng thái Khóa / Đang Hãm Phanh (Disabled) */
      .lottery-control-btn:disabled,
      .lottery-control-btn.is-stopping {
        opacity: 0.6;
        cursor: not-allowed;
        pointer-events: none;
        transform: none !important;
        animation: none !important;
      }

      /* ============================================================
         MODAL VINH DANH NGƯỜI TRÚNG (LIQUID GLASS SIÊU TRONG SUỐT)
         ============================================================ */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 100;
        background: rgba(4, 2, 8, 0.45); /* Siêu trong suốt */
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .modal-overlay.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .modal-card {
        position: relative;
        width: 100%;
        max-width: 680px;
        background: rgba(255, 255, 255, 0.04); /* Kính siêu trong lộ nền */
        backdrop-filter: blur(45px) saturate(220%) contrast(110%);
        -webkit-backdrop-filter: blur(45px) saturate(220%) contrast(110%);
        border-radius: 28px;
        padding: 20px 32px 20px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        box-shadow: 
          inset 2.5px 2.5px 6px rgba(255, 255, 255, 0.75),
          inset -2.5px -2.5px 6px rgba(0, 0, 0, 0.6),
          inset 0 25px 50px rgba(255, 255, 255, 0.12),
          0 35px 90px rgba(0, 0, 0, 0.85),
          0 0 80px rgba(243, 112, 33, 0.38);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transform: translateY(24px) scale(0.95);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Viền lăng kính trên modal */
      .modal-card::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1.5px;
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.8) 0%,
          rgba(243, 112, 33, 0.5) 45%,
          rgba(239, 65, 35, 0.3) 100%
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      /* Đốm sáng cong đỉnh modal */
      .modal-card::after {
        content: "";
        position: absolute;
        top: 0;
        left: 15%;
        right: 15%;
        height: 35%;
        border-radius: 26px 26px 0 0;
        background: radial-gradient(
          ellipse at 50% 0%,
          rgba(255, 255, 255, 0.45) 0%,
          rgba(255, 255, 255, 0.09) 50%,
          transparent 75%
        );
        pointer-events: none;
      }

      .modal-overlay.is-visible .modal-card {
        transform: translateY(0) scale(1);
      }

      /* Nút đóng hình tròn Liquid Glass Orb ở góc trên modal */
      .modal-close-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.28);
        color: rgba(255, 255, 255, 0.85);
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 
          inset 1.5px 1.5px 3px rgba(255, 255, 255, 0.65),
          inset -1.5px -1.5px 3px rgba(0, 0, 0, 0.5),
          0 8px 20px rgba(0, 0, 0, 0.4);
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 15;
      }

      .modal-close-btn:hover {
        background: rgba(243, 112, 33, 0.25);
        border-color: rgba(243, 112, 33, 0.7);
        color: #ffffff;
        transform: scale(1.08);
        box-shadow: 
          inset 1.5px 1.5px 3px rgba(255, 255, 255, 0.85),
          inset -1.5px -1.5px 3px rgba(0, 0, 0, 0.4),
          0 10px 25px rgba(243, 112, 33, 0.4),
          0 0 20px rgba(243, 112, 33, 0.55);
      }

      .modal-close-btn:active {
        transform: scale(0.95);
      }

      /* Banner Giải Thưởng Vũ Trụ / Ngân Hà / Tinh Tú */
      .modal-prize-banner-wrapper {
        width: 100%;
        max-width: 500px;
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 12px;
        box-shadow: 
          0 10px 30px rgba(0, 0, 0, 0.7),
          0 0 25px rgba(243, 112, 33, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(0, 0, 0, 0.5);
      }

      .modal-prize-banner-img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: cover;
      }

      /* Bỏ tiêu đề giải trên modal vì đã có trên banner */
      .modal-prize-title {
        display: none !important;
      }

      /* Bỏ nhãn số vòng tay thừa trên modal */
      .modal-code-label {
        display: none !important;
      }

      /* Số trúng giải (Số vòng tay): Dạng Text lớn sắc nét, ánh kim cam đỏ MSB siêu thực */
      .modal-code-badge {
        display: block;
        font-size: 72px;
        font-weight: 900;
        letter-spacing: 0.14em;
        line-height: 1.1;
        margin-bottom: 6px;
        font-feature-settings: "tnum";
        font-variant-numeric: tabular-nums;
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #fff1ea 35%,
          #f37021 75%,
          #ef4123 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.95))
                drop-shadow(0 0 24px rgba(243, 112, 33, 0.7));
      }

      /* Tên người trúng giải: Dạng Text thanh thoát, hào quang phát sáng nổi bật */
      .modal-winner-name {
        display: block;
        max-width: 600px;
        margin: 0 auto 18px;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #ffffff;
        text-align: center;
        line-height: 1.3;
        word-break: break-word;
        text-shadow: 
          0 2px 10px rgba(0, 0, 0, 0.95),
          0 0 20px rgba(243, 112, 33, 0.85),
          0 0 40px rgba(239, 65, 35, 0.6);
        animation: winnerNameGlow 2.5s ease-in-out infinite alternate;
      }

      @keyframes winnerNameGlow {
        0% {
          text-shadow: 
            0 2px 10px rgba(0, 0, 0, 0.95),
            0 0 16px rgba(243, 112, 33, 0.75),
            0 0 30px rgba(239, 65, 35, 0.5);
          transform: scale(1);
        }
        100% {
          text-shadow: 
            0 2px 12px rgba(0, 0, 0, 0.95),
            0 0 22px #ffffff,
            0 0 38px rgba(243, 112, 33, 0.95),
            0 0 55px rgba(239, 65, 35, 0.75);
          transform: scale(1.02);
        }
      }

      .modal-winner-agency,
      .modal-meta-list {
        display: none !important;
      }

      .modal-meta-card {
        display: none !important;
      }

      /* Modal Action Buttons: 100% LIQUID GLASS BUTTONS */
      .modal-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        width: 100%;
        max-width: 440px;
      }

      .btn-modal {
        position: relative;
        flex: 1;
        padding: 12px 24px;
        border-radius: 16px;
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        border: 1px solid transparent;
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        overflow: hidden;
      }

      /* Nút "VẮNG MẶT": Kính lỏng phản quang đỏ nhẹ */
      .btn-absent {
        background: rgba(237, 28, 36, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #ffb3b3;
        box-shadow: 
          inset 1.5px 1.5px 3px 0 rgba(255, 255, 255, 0.65),
          inset -1.5px -1.5px 3px 0 rgba(0, 0, 0, 0.5),
          0 10px 25px rgba(0, 0, 0, 0.45);
      }

      .btn-absent::before {
        content: "";
        position: absolute;
        top: 0;
        left: 15%;
        right: 15%;
        height: 45%;
        border-radius: 18px 18px 0 0;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.3) 0%,
          transparent 100%
        );
        pointer-events: none;
      }

      .btn-absent:hover {
        background: rgba(237, 28, 36, 0.22);
        border-color: rgba(255, 255, 255, 0.45);
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 
          inset 1.5px 1.5px 3px 0 rgba(255, 255, 255, 0.8),
          0 14px 30px rgba(237, 28, 36, 0.35);
      }

      .btn-absent:active {
        transform: scale(0.98);
      }

      /* Nút "TIẾP TỤC": Kính lỏng Cam MSB nổi khối 3D rực rỡ */
      .btn-continue {
        background: linear-gradient(
          135deg,
          rgba(243, 112, 33, 0.4) 0%,
          rgba(239, 65, 35, 0.5) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.45);
        color: #ffffff;
        box-shadow: 
          inset 2px 2px 4px 0 rgba(255, 255, 255, 0.85),
          inset -2px -2px 4px 0 rgba(0, 0, 0, 0.55),
          0 12px 32px rgba(243, 112, 33, 0.55),
          0 0 25px rgba(243, 112, 33, 0.4);
      }

      .btn-continue::before {
        content: "";
        position: absolute;
        top: 0;
        left: 10%;
        right: 10%;
        height: 48%;
        border-radius: 18px 18px 0 0;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.45) 0%,
          transparent 100%
        );
        pointer-events: none;
      }

      .btn-continue:hover {
        background: linear-gradient(
          135deg,
          rgba(243, 112, 33, 0.55) 0%,
          rgba(239, 65, 35, 0.65) 100%
        );
        border-color: rgba(255, 255, 255, 0.65);
        transform: translateY(-1px);
        box-shadow: 
          inset 2px 2px 4px 0 rgba(255, 255, 255, 0.95),
          0 16px 40px rgba(243, 112, 33, 0.75),
          0 0 35px rgba(243, 112, 33, 0.6);
      }

      .btn-continue:active {
        transform: translateY(0) scale(0.98);
      }



      /* ============================================================
         MODAL DANH SÁCH NGƯỜI TRÚNG GIẢI (LIQUID GLASS)
         ============================================================ */
      .winner-list-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 110;
        background: rgba(4, 2, 8, 0.5);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .winner-list-modal-overlay.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .winner-list-card {
        position: relative;
        width: 100%;
        max-width: 520px;
        max-height: calc(100vh - 40px);
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(40px) saturate(220%) contrast(110%);
        -webkit-backdrop-filter: blur(40px) saturate(220%) contrast(110%);
        border-radius: 24px;
        padding: 20px 24px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        box-shadow: 
          inset 2px 2px 5px rgba(255, 255, 255, 0.65),
          inset -2px -2px 5px rgba(0, 0, 0, 0.5),
          0 35px 85px rgba(0, 0, 0, 0.85),
          0 0 75px rgba(243, 112, 33, 0.4);
        display: flex;
        flex-direction: column;
        transform: translateY(20px) scale(0.96);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .winner-list-modal-overlay.is-visible .winner-list-card {
        transform: translateY(0) scale(1);
      }

      .winner-list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }

      .winner-list-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #ffffff;
        text-shadow: 0 0 16px rgba(243, 112, 33, 0.6);
      }

      /* Nút đóng tròn dạng Liquid Glass cho Modal Danh sách */
      .winner-list-close-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.28);
        color: rgba(255, 255, 255, 0.85);
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 
          inset 1.5px 1.5px 3px rgba(255, 255, 255, 0.65),
          inset -1.5px -1.5px 3px rgba(0, 0, 0, 0.5),
          0 8px 20px rgba(0, 0, 0, 0.4);
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .winner-list-close-btn:hover {
        background: rgba(243, 112, 33, 0.25);
        border-color: rgba(243, 112, 33, 0.7);
        color: #ffffff;
        transform: scale(1.08);
        box-shadow: 
          inset 1.5px 1.5px 3px rgba(255, 255, 255, 0.85),
          inset -1.5px -1.5px 3px rgba(0, 0, 0, 0.4),
          0 10px 25px rgba(243, 112, 33, 0.4),
          0 0 20px rgba(243, 112, 33, 0.55);
      }

      .winner-list-close-btn:active {
        transform: scale(0.95);
      }

      .winner-list-scroll {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-right: 6px;
        max-height: calc(100vh - 120px);
      }

      /* Từng hàng người trúng giải */
      .winner-list-row {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding: 10px 16px;
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        transition: all 0.2s ease;
      }

      .winner-list-row:hover {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(243, 112, 33, 0.4);
      }

      .winner-list-left {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
      }

      .winner-list-code {
        font-size: 18px;
        font-weight: 800;
        color: #ffffff;
        text-shadow: 0 0 12px rgba(243, 112, 33, 0.8);
        font-feature-settings: "tnum";
        font-variant-numeric: tabular-nums;
        min-width: 58px;
      }

      .winner-list-info {
        text-align: left;
        flex: 1;
      }

      .winner-list-name {
        font-size: 15px;
        font-weight: 700;
        color: #ffffff;
      }

      .winner-list-agency,
      .winner-list-right {
        display: none !important;
      }

      .winner-list-empty {
        padding: 30px 20px;
        text-align: center;
        color: rgba(255, 255, 255, 0.5);
        font-size: 14px;
      }

      /* Nút Làm Mới ở góc màn hình */
      .corner-reset-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 30;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 9999px;
        padding: 8px 16px;
        color: rgba(255, 255, 255, 0.4);
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        transition: all 0.25s ease;
      }

      .corner-reset-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.3);
        color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }

      /* ============================================================
         RESPONSIVE BREAKPOINTS
         ============================================================ */
      @media (max-width: 768px) {
        .lottery-stage {
          gap: 24px;
          padding: 16px;
        }

        .prize-dropdown-trigger {
          padding: 10px 20px;
        }

        .prize-title-display {
          font-size: 14px;
        }

        .slot-machine-container {
          padding: 22px 26px;
          border-radius: 28px;
        }

        .slot-grid {
          gap: 12px;
        }

        .slot-cell {
          width: 72px;
          height: 104px;
          border-radius: 16px;
        }

        .digit-item {
          height: 104px;
          line-height: 104px;
          font-size: 64px;
        }

        .modal-card {
          padding: 32px 24px;
        }

        .modal-code-badge {
          font-size: 36px;
          padding: 8px 24px;
        }

        .modal-winner-name {
          font-size: 24px;
        }
      }

      @media (min-width: 1800px) {
        .slot-cell {
          width: 165px;
          height: 215px;
        }

        .digit-item {
          height: 215px;
          line-height: 215px;
          font-size: 135px;
        }

        .prize-title-display {
          font-size: 19px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Video nền động sân khấu quay số MSB (Background duy nhất) -->
    <div class="bg-video-container">
      <video
        id="bgVideo"
        class="bg-video-element"
        autoplay
        loop
        muted
        playsinline
        preload="auto"
      >
        <source src="bg-quayso-1344x576.mp4" type="video/mp4" />
      </video>
    </div>

    <!-- Canvas Ăn Mừng Sao Băng & Pháo Hoa Cam Đỏ MSB (Chỉ kích hoạt khi trúng giải) -->
    <canvas id="celebrationCanvas"></canvas>

    <!-- Nội dung chính giữa màn hình -->
    <div class="lottery-stage">
      <!-- Dropdown Chọn Giải Thưởng (Liquid Glass Pill) -->
      <div class="prize-dropdown-wrapper" id="prizeDropdownWrapper">
        <div
          class="prize-dropdown-trigger"
          id="prizeDropdownTrigger"
          onclick="togglePrizeDropdown(event)"
        >
          <div class="prize-badge-indicator"></div>
          <div class="prize-title-display" id="currentPrizeTitle">
            GIẢI VŨ TRỤ
          </div>
          <!-- Badge số lượng giải: Chỉ hiện khi có >= 1 giải -->
          <div
            class="prize-count-tag"
            id="currentPrizeCountTag"
            onclick="handleCurrentPrizeCountClick(event)"
          ></div>
          <div class="prize-dropdown-chevron"></div>
        </div>

        <div class="prize-dropdown-menu" id="prizeDropdownMenu">
          <button
            class="prize-option-item is-selected"
            data-tier="Vũ Trụ"
            onclick="selectPrizeTier('Vũ Trụ')"
          >
            <span>GIẢI VŨ TRỤ</span>
            <span class="prize-option-count" id="count-tier-vu-tru"></span>
          </button>
          <button
            class="prize-option-item"
            data-tier="Ngân Hà"
            onclick="selectPrizeTier('Ngân Hà')"
          >
            <span>GIẢI NGÂN HÀ</span>
            <span class="prize-option-count" id="count-tier-ngan-ha"></span>
          </button>
          <button
            class="prize-option-item"
            data-tier="Tinh Tú"
            onclick="selectPrizeTier('Tinh Tú')"
          >
            <span>GIẢI TINH TÚ</span>
            <span class="prize-option-count" id="count-tier-tinh-tu"></span>
          </button>
        </div>
      </div>

      <!-- Ô Quay Số 4 Chữ Số (Khối Thủy Tinh Giọt Nước 3D, Không Đồng Trục) -->
      <div
        class="slot-machine-container"
        id="slotMachineContainer"
      >
        <div class="slot-grid">
          <div class="slot-cell" id="slot-cell-0">
            <div class="digit-strip" id="strip-0"></div>
          </div>
          <div class="slot-cell" id="slot-cell-1">
            <div class="digit-strip" id="strip-1"></div>
          </div>
          <div class="slot-cell" id="slot-cell-2">
            <div class="digit-strip" id="strip-2"></div>
          </div>
          <div class="slot-cell" id="slot-cell-3">
            <div class="digit-strip" id="strip-3"></div>
          </div>
        </div>
      </div>

      <!-- Nút Điều Khiển Quay Số: Liquid Glass MSB (QUAY SỐ / DỪNG LẠI / QUAY TIẾP) -->
      <button
        id="lotteryControlBtn"
        class="lottery-control-btn"
        onclick="handleLotteryControlClick()"
        aria-label="Quay số may mắn"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>QUAY SỐ</span>
      </button>
    </div>

    <!-- Modal Vinh Danh Người Trúng Thưởng (Liquid Glass Siêu Trong Suốt) -->
    <div class="modal-overlay" id="winnerModalOverlay">
      <div class="modal-card">
        <button class="modal-close-btn" onclick="hideWinnerModal()" aria-label="Đóng">✕</button>
        
        <!-- Banner Đồ Họa Giải Thưởng MSB (Đã có tên giải và quà tặng) -->
        <div class="modal-prize-banner-wrapper" id="modalPrizeBannerWrapper">
          <img src="" id="modalPrizeBannerImg" class="modal-prize-banner-img" alt="Banner Giải Thưởng" />
        </div>

        <div class="modal-code-badge" id="modalWinnerCode">0000</div>
        <div class="modal-winner-name" id="modalWinnerName">NGUYỄN VĂN A</div>

        <div class="modal-actions">
          <button class="btn-modal btn-absent" onclick="handleWinnerAbsent()">
            VẮNG MẶT
          </button>
          <button class="btn-modal btn-continue" onclick="handleWinnerConfirm()">
            TRÚNG GIẢI
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Danh Sách Người Trúng Giải (Liquid Glass) -->
    <div class="winner-list-modal-overlay" id="winnerListModalOverlay" onclick="handleWinnerListOverlayClick(event)">
      <div class="winner-list-card">
        <div class="winner-list-header">
          <div class="winner-list-title" id="winnerListModalTitle">DANH SÁCH TRÚNG THƯỞNG</div>
          <button class="winner-list-close-btn" onclick="closeWinnerListModal()" aria-label="Đóng">✕</button>
        </div>
        <div class="winner-list-scroll" id="winnerListScrollContainer">
          <!-- Các hàng danh sách người trúng giải sẽ render tại đây -->
        </div>
      </div>
    </div>

    <!-- Nút Làm Mới ở góc màn hình -->
    <button
      class="corner-reset-btn"
      id="cornerResetBtn"
      onclick="handleResetSession()"
    >
      LÀM MỚI
    </button>

    <script>
      /* ============================================================
         QUẢN LÝ DỮ LIỆU & TRẠNG THÁI ỨNG DỤNG
         ============================================================ */
      const PRIZE_CONFIG = {
        "Vũ Trụ": {
          name: "GIẢI VŨ TRỤ",
          subName: "IPHONE DUO 256GB",
          code: "vu-tru",
          banner: "images/prize-vu-tru.png",
          rank: 1,
        },
        "Ngân Hà": {
          name: "GIẢI NGÂN HÀ",
          subName: "APPLE WATCH SERIES 12",
          code: "ngan-ha",
          banner: "images/prize-ngan-ha.png",
          rank: 2,
        },
        "Tinh Tú": {
          name: "GIẢI TINH TÚ",
          subName: "TAI NGHE AIRPODS",
          code: "tinh-tu",
          banner: "images/prize-tinh-tu.png",
          rank: 3,
        },
      };

      let currentSelectedTier = "Vũ Trụ";
      let participants = []; // Danh sách khách hàng ĐÃ CHECK-IN (có số vòng tay)
      let usedNumbers = []; // Danh sách số vòng tay đã trúng
      let absentWinners = []; // Danh sách số vòng tay vắng mặt
      let sessionWinners = []; // Danh sách kết quả phiên quay

      let isSpinning = false;
      let spinTimeoutId = null;
      let currentWinnerCandidate = null;

      // Cấu hình lồng quay 4 số
      const DIGIT_COUNT = 4;
      const STRIP_REPEAT = 40; // Lặp 40 chu kỳ số 0-9 (400 số) đảm bảo dải số siêu dài, không bao giờ cạn
      let stripPositions = [0, 0, 0, 0];
      let stripVelocities = [0, 0, 0, 0];
      let stripAnimFrameIds = [null, null, null, null];
      let stripFallbackTimers = [null, null, null, null];
      let isStripSpinning = [false, false, false, false];

      // Biến điều khiển dao động 3D không đồng trục
      let nonCoaxialAngle = 0;
      let nonCoaxialFrameId = null;

      /* ============================================================
         KHỞI TẠO & CĂN CHỈNH CHIỀU CAO Ô SỐ CHÍNH XÁC 100%
         ============================================================ */
      function getCellHeight() {
        const cell = document.getElementById("slot-cell-0");
        return cell ? cell.clientHeight : 180;
      }

      function initSlotStrips() {
        const h = getCellHeight();
        for (let col = 0; col < DIGIT_COUNT; col++) {
          const stripEl = document.getElementById(`strip-${col}`);
          if (!stripEl) continue;
          stripEl.innerHTML = "";

          // Tạo chuỗi số 0-9 với chiều cao đồng bộ tuyệt đối với ô kính
          for (let r = 0; r < STRIP_REPEAT; r++) {
            for (let d = 0; d <= 9; d++) {
              const digitDiv = document.createElement("div");
              digitDiv.className = "digit-item";
              digitDiv.style.height = `${h}px`;
              digitDiv.style.lineHeight = `${h}px`;
              digitDiv.textContent = d.toString();
              stripEl.appendChild(digitDiv);
            }
          }
          stripPositions[col] = 0;
          setStripTransform(col, 0);
        }
      }

      function setStripTransform(col, y) {
        const stripEl = document.getElementById(`strip-${col}`);
        if (stripEl) {
          stripEl.style.transform = `translate3d(0, ${-y}px, 0)`;
        }
      }

      /* ============================================================
         DAO ĐỘNG 3D KHÔNG ĐỒNG TRỤC (NON-COAXIAL 3D REVOLUTION)
         ============================================================ */
      function startNonCoaxialAnimation() {
        function step() {
          if (!isSpinning) return;
          nonCoaxialAngle += 0.08;

          const offsets = [
            Math.sin(nonCoaxialAngle) * 4.2,
            Math.cos(nonCoaxialAngle * 1.15) * 4.8,
            Math.sin(nonCoaxialAngle * 0.9 + 1.2) * 3.9,
            Math.cos(nonCoaxialAngle * 1.05 + 2.1) * 4.5,
          ];

          const tiltX = [
            Math.sin(nonCoaxialAngle) * 1.8,
            Math.cos(nonCoaxialAngle * 1.1) * -1.8,
            Math.sin(nonCoaxialAngle * 0.95) * 1.5,
            Math.cos(nonCoaxialAngle * 1.2) * -1.5,
          ];

          for (let col = 0; col < DIGIT_COUNT; col++) {
            if (isStripSpinning[col]) {
              const cell = document.getElementById(`slot-cell-${col}`);
              if (cell) {
                cell.style.transform = `translate3d(0, ${offsets[col]}px, 0) rotateX(${tiltX[col]}deg)`;
              }
            }
          }

          nonCoaxialFrameId = requestAnimationFrame(step);
        }

        nonCoaxialFrameId = requestAnimationFrame(step);
      }

      function stopNonCoaxialForColumn(col) {
        const cell = document.getElementById(`slot-cell-${col}`);
        if (cell) {
          cell.style.transform = `translate3d(0, 0px, 0) rotateX(0deg)`;
        }
      }

      /* ============================================================
         ĐỌC FILE DATA/EXPORT.CSV (CHỈ LẤY KHÁCH HÀNG CÓ SỐ VÒNG TAY)
         ============================================================ */
      async function loadParticipantsData() {
        try {
          const response = await fetch("data/export_20260925_170752.csv?t=" + Date.now());
          let csvText = await response.text();
          // Loại bỏ ký tự BOM (Byte Order Mark) nếu file xuất từ Excel
          if (csvText.charCodeAt(0) === 0xfeff) {
            csvText = csvText.slice(1);
          }

          const lines = csvText.split(/\r?\n/);
          if (lines.length <= 0) return;

          participants = [];
          for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            const cols = parseCSVLine(line);
            if (cols.length >= 1) {
              const rawId = (cols[0] || "").replace(/["']/g, "").trim().replace(/^\ufeff/, "");
              const id = parseInt(rawId, 10);
              // ĐIỀU KIỆN TIÊN QUYẾT: Chỉ lấy khách hàng ĐÃ CHECK-IN (có số vòng tay hợp lệ > 0)
              if (!isNaN(id) && id > 0) {
                const name = (cols[1] || "").replace(/["']/g, "").trim();
                participants.push({
                  id,
                  name: name || `Khách hàng #${id}`,
                });
              }
            }
          }

          console.log(`Đã nạp thành công ${participants.length} khách hàng có số vòng tay hợp lệ.`);
          restoreSessionState();
        } catch (err) {
          console.error("Lỗi khi tải dữ liệu từ data/export_20260925_170752.csv:", err);
        }
      }

      function parseCSVLine(line) {
        const delimiter = line.includes(";") ? ";" : ",";
        const result = [];
        let current = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === delimiter && !inQuotes) {
            result.push(current);
            current = "";
          } else {
            current += char;
          }
        }
        result.push(current);
        return result;
      }

      /* ============================================================
         LƯU & KHÔI PHỤC SESSION STORAGE
         ============================================================ */
      function restoreSessionState() {
        try {
          const savedUsed = sessionStorage.getItem("msb_usedNumbers");
          if (savedUsed) usedNumbers = JSON.parse(savedUsed);

          const savedAbsent = sessionStorage.getItem("msb_absentWinners");
          if (savedAbsent) absentWinners = JSON.parse(savedAbsent);

          const savedWinners = sessionStorage.getItem("msb_winnersData");
          if (savedWinners) sessionWinners = JSON.parse(savedWinners);

          updatePrizeCountsUI();
        } catch (e) {
          console.warn("Lỗi khi đọc session storage:", e);
        }
      }

      function saveSessionState() {
        try {
          sessionStorage.setItem("msb_usedNumbers", JSON.stringify(usedNumbers));
          sessionStorage.setItem("msb_absentWinners", JSON.stringify(absentWinners));
          sessionStorage.setItem("msb_winnersData", JSON.stringify(sessionWinners));
        } catch (e) {
          console.warn("Lỗi khi lưu session storage:", e);
        }
      }

      /* ============================================================
         CẬP NHẬT GIAO DIỆN SỐ LƯỢNG GIẢI (0 GIẢI THÌ ẨN, >=1 MỚI HIỆN)
         ============================================================ */
      function updatePrizeCountsUI() {
        const counts = { "Vũ Trụ": 0, "Ngân Hà": 0, "Tinh Tú": 0 };
        sessionWinners.forEach((w) => {
          if (counts[w.tier] !== undefined) {
            counts[w.tier]++;
          }
        });

        // 1. Cập nhật tag ở thanh Trigger chính
        const curCount = counts[currentSelectedTier] || 0;
        const countTag = document.getElementById("currentPrizeCountTag");
        if (countTag) {
          if (curCount === 0) {
            countTag.style.display = "none";
          } else {
            countTag.style.display = "inline-flex";
            countTag.textContent = `${curCount} giải`;
            countTag.title = "Nhấn để xem danh sách trúng giải này";
          }
        }

        // 2. Cập nhật từng mục trong dropdown list
        const tierMapping = [
          { tier: "Vũ Trụ", elId: "count-tier-vu-tru" },
          { tier: "Ngân Hà", elId: "count-tier-ngan-ha" },
          { tier: "Tinh Tú", elId: "count-tier-tinh-tu" },
        ];

        tierMapping.forEach((item) => {
          const count = counts[item.tier] || 0;
          const el = document.getElementById(item.elId);
          if (el) {
            if (count === 0) {
              el.style.display = "none";
            } else {
              el.style.display = "inline-flex";
              el.textContent = `${count} giải`;
              el.title = "Nhấn để xem danh sách trúng giải";
              el.onclick = (e) => {
                e.stopPropagation();
                openWinnerListModal(item.tier);
              };
            }
          }
        });
      }

      function handleCurrentPrizeCountClick(event) {
        event.stopPropagation();
        openWinnerListModal(currentSelectedTier);
      }

      /* ============================================================
         MODAL DANH SÁCH NGƯỜI TRÚNG GIẢI (LIQUID GLASS)
         ============================================================ */
      function openWinnerListModal(tier) {
        const modal = document.getElementById("winnerListModalOverlay");
        const titleEl = document.getElementById("winnerListModalTitle");
        const container = document.getElementById("winnerListScrollContainer");
        if (!modal || !container) return;

        const tierInfo = PRIZE_CONFIG[tier] || { name: tier, subName: "" };
        const filtered = sessionWinners.filter((w) => w.tier === tier);

        if (titleEl) {
          titleEl.textContent = `DANH SÁCH TRÚNG ${tierInfo.name}`;
        }

        container.innerHTML = "";

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="winner-list-empty">
              Chưa có người trúng giải này trong phiên quay hiện tại.
            </div>
          `;
        } else {
          filtered.forEach((winner) => {
            const row = document.createElement("div");
            row.className = "winner-list-row";
            row.innerHTML = `
              <div class="winner-list-left">
                <div class="winner-list-code">#${winner.id.toString().padStart(DIGIT_COUNT, "0")}</div>
                <div class="winner-list-info">
                  <div class="winner-list-name">${winner.name}</div>
                </div>
              </div>
            `;
            container.appendChild(row);
          });
        }

        modal.classList.add("is-visible");
      }

      function closeWinnerListModal() {
        const modal = document.getElementById("winnerListModalOverlay");
        if (modal) modal.classList.remove("is-visible");
      }

      function handleWinnerListOverlayClick(e) {
        if (e.target.id === "winnerListModalOverlay") {
          closeWinnerListModal();
        }
      }

      /* ============================================================
         LOGIC DROPDOWN CHỌN GIẢI THƯỞNG
         ============================================================ */
      function togglePrizeDropdown(event) {
        event.stopPropagation();
        if (isSpinning) return;
        const wrapper = document.getElementById("prizeDropdownWrapper");
        wrapper.classList.toggle("is-open");
      }

      function selectPrizeTier(tier) {
        if (isSpinning) return;
        currentSelectedTier = tier;
        const titleEl = document.getElementById("currentPrizeTitle");
        if (titleEl) {
          titleEl.textContent = PRIZE_CONFIG[tier] ? PRIZE_CONFIG[tier].name : tier;
        }

        document.querySelectorAll(".prize-option-item").forEach((item) => {
          if (item.dataset.tier === tier) {
            item.classList.add("is-selected");
          } else {
            item.classList.remove("is-selected");
          }
        });

        const wrapper = document.getElementById("prizeDropdownWrapper");
        if (wrapper) wrapper.classList.remove("is-open");

        updatePrizeCountsUI();
      }

      window.addEventListener("click", () => {
        const wrapper = document.getElementById("prizeDropdownWrapper");
        if (wrapper) wrapper.classList.remove("is-open");
      });

      /* ============================================================
          QUAY SỐ & ĐIỀU KHIỂN NÚT BẤM (CHẬM RÃI, MƯỢT MÀ)
         ============================================================ */
      function updateControlButtonState(state) {
        const btn = document.getElementById("lotteryControlBtn");
        if (!btn) return;

        if (state === "spinning") {
          btn.classList.add("is-spinning");
          btn.classList.remove("is-stopping");
          btn.disabled = false;
          btn.innerHTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <rect x="5" y="5" width="14" height="14" rx="2" />
            </svg>
            <span>DỪNG LẠI</span>
          `;
        } else if (state === "stopping") {
          btn.classList.add("is-spinning", "is-stopping");
          btn.disabled = true;
          btn.innerHTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <rect x="5" y="5" width="14" height="14" rx="2" />
            </svg>
            <span>ĐANG DỪNG...</span>
          `;
        } else if (state === "ready-next") {
          btn.classList.remove("is-spinning", "is-stopping");
          btn.disabled = false;
          btn.innerHTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>QUAY TIẾP</span>
          `;
        } else {
          // initial
          btn.classList.remove("is-spinning", "is-stopping");
          btn.disabled = false;
          btn.innerHTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>QUAY SỐ</span>
          `;
        }
      }

      function handleLotteryControlClick() {
        if (!isSpinning) {
          startSpin();
        } else {
          stopSpin();
        }
      }

      function startSpin() {
        if (isSpinning) return;

        const modal = document.getElementById("winnerModalOverlay");
        if (modal && modal.classList.contains("is-visible")) return;

        const listModal = document.getElementById("winnerListModalOverlay");
        if (listModal && listModal.classList.contains("is-visible")) return;

        const available = participants.filter(
          (p) =>
            !usedNumbers.includes(p.id) &&
            !absentWinners.includes(p.id)
        );

        if (available.length === 0) {
          alert("Đã hết khách hàng có số vòng tay hợp lệ chưa trúng giải!");
          return;
        }

        currentWinnerCandidate =
          available[Math.floor(Math.random() * available.length)];

        isSpinning = true;
        updateControlButtonState("spinning");

        const container = document.getElementById("slotMachineContainer");
        if (container) {
          container.classList.remove("is-celebrating");
          container.classList.add("is-spinning");
        }

        // Bắt đầu dao động 3D không đồng trục
        startNonCoaxialAnimation();

        // Khởi tạo vị trí ngẫu nhiên so le cho 4 cột (LỆCH Ô HOÀN TOÀN)
        const h = getCellHeight();
        const initialStagger = [
          Math.random() * h * 0.4,
          h * 0.6 + Math.random() * h * 0.3,
          h * 0.2 + Math.random() * h * 0.4,
          h * 0.8 + Math.random() * h * 0.3,
        ];

        // Khởi động 4 cột quay với vận tốc khác nhau rõ rệt (KHÔNG CÙNG CHU KỲ)
        for (let i = 0; i < DIGIT_COUNT; i++) {
          if (stripFallbackTimers[i]) {
            clearTimeout(stripFallbackTimers[i]);
            stripFallbackTimers[i] = null;
          }
          const cell = document.getElementById(`slot-cell-${i}`);
          if (cell) {
            cell.classList.add("is-spinning");
            cell.classList.remove("is-locked");
          }
          isStripSpinning[i] = true;
          stripPositions[i] = (stripPositions[i] + initialStagger[i]) % (h * 10);
          startStripContinuousSpin(i);
        }

        // QUAY LIÊN TỤC CHO ĐẾN KHI BẤM DỪNG (Không tự động dừng)
      }

      function startStripContinuousSpin(col) {
        const h = getCellHeight();
        const cycleHeight = h * 10;
        const maxScroll = cycleHeight * (STRIP_REPEAT - 10);

        // Vận tốc cuộn vừa phải, các số chạy chậm rõ nét, mượt mà và hồi hộp
        const baseSpeed = [24, 18, 26, 20];
        stripVelocities[col] = (baseSpeed[col] || 20) + Math.random() * 2;

        function step() {
          if (!isStripSpinning[col]) return;
          stripPositions[col] += stripVelocities[col];
          if (stripPositions[col] >= maxScroll) {
            stripPositions[col] -= cycleHeight * 10;
          }
          setStripTransform(col, stripPositions[col]);
          stripAnimFrameIds[col] = requestAnimationFrame(step);
        }

        stripAnimFrameIds[col] = requestAnimationFrame(step);
      }

      function stopSpin() {
        if (!isSpinning) return;
        if (spinTimeoutId) {
          clearTimeout(spinTimeoutId);
          spinTimeoutId = null;
        }

        updateControlButtonState("stopping");

        const container = document.getElementById("slotMachineContainer");
        if (container) container.classList.remove("is-spinning");

        const targetIdStr = currentWinnerCandidate.id
          .toString()
          .padStart(DIGIT_COUNT, "0");
        const targetDigits = targetIdStr.split("").map((d) => parseInt(d, 10));

        // Dừng so le từ trái sang phải với độ trễ 320ms mỗi số
        const cascadeDelay = 320;
        for (let col = 0; col < DIGIT_COUNT; col++) {
          setTimeout(() => {
            stopSingleStrip(col, targetDigits[col]);
          }, col * cascadeDelay);
        }

        const totalStopTime = (DIGIT_COUNT - 1) * cascadeDelay + 700;
        setTimeout(() => {
          onAllDigitsLocked();
        }, totalStopTime);
      }

      function stopSingleStrip(col, targetDigit) {
        isStripSpinning[col] = false;
        if (stripAnimFrameIds[col]) {
          cancelAnimationFrame(stripAnimFrameIds[col]);
          stripAnimFrameIds[col] = null;
        }
        if (stripFallbackTimers[col]) {
          clearTimeout(stripFallbackTimers[col]);
          stripFallbackTimers[col] = null;
        }

        stopNonCoaxialForColumn(col);

        const h = getCellHeight();
        const currentY = stripPositions[col];

        // Tìm vị trí chữ số mục tiêu tiếp theo trên dải số an toàn theo modulo
        const currentIndex = Math.ceil(currentY / h);
        const currentMod = ((currentIndex % 10) + 10) % 10;
        let diff = (targetDigit - currentMod + 10) % 10;
        if (diff < 4) diff += 10;
        diff += 10; // Đảm bảo luôn trượt thêm ít nhất 1 vòng đầy đủ để giảm tốc êm ái

        const targetIndex = currentIndex + diff;
        const targetY = targetIndex * h;
        const startY = currentY;
        const startTime = performance.now();
        const duration = 650; // Giảm tốc trong 650ms

        function easeOutCubic(t) {
          return --t * t * t + 1;
        }

        let isStopped = false;
        function finalizeStop() {
          if (isStopped) return;
          isStopped = true;
          if (stripAnimFrameIds[col]) {
            cancelAnimationFrame(stripAnimFrameIds[col]);
            stripAnimFrameIds[col] = null;
          }
          if (stripFallbackTimers[col]) {
            clearTimeout(stripFallbackTimers[col]);
            stripFallbackTimers[col] = null;
          }
          // KHÓA CHÍNH TÂM 100% TUYỆT ĐỐI THEO PIXEL TARGET
          stripPositions[col] = targetY;
          setStripTransform(col, targetY);

          const cell = document.getElementById(`slot-cell-${col}`);
          if (cell) {
            cell.classList.remove("is-spinning");
            cell.classList.add("is-locked");
          }
        }

        function animateStop(now) {
          if (isStopped) return;
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeProgress = easeOutCubic(progress);

          const currentDecelY = startY + (targetY - startY) * easeProgress;
          setStripTransform(col, currentDecelY);

          if (progress < 1) {
            stripAnimFrameIds[col] = requestAnimationFrame(animateStop);
          } else {
            finalizeStop();
          }
        }

        stripAnimFrameIds[col] = requestAnimationFrame(animateStop);

        // Watchdog Fallback Timer: Bảo hiểm 100% không bao giờ bị lơ lửng nếu rAF bị drop frame
        stripFallbackTimers[col] = setTimeout(() => {
          finalizeStop();
        }, duration + 40);
      }

      function onAllDigitsLocked() {
        isSpinning = false;
        if (nonCoaxialFrameId) {
          cancelAnimationFrame(nonCoaxialFrameId);
          nonCoaxialFrameId = null;
        }

        const container = document.getElementById("slotMachineContainer");
        if (container) container.classList.add("is-celebrating");

        // Kích hoạt pháo hoa sao băng ăn mừng (Chỉ màu Cam - Đỏ MSB)
        triggerCelebration();

        // Chuyển nút về trạng thái sẵn sàng cho lượt tiếp
        updateControlButtonState("ready-next");

        // Hiển thị modal vinh danh sau khi pháo hoa bung tỏa (delay 1.6s)
        setTimeout(() => {
          showWinnerModal(currentWinnerCandidate, currentSelectedTier);
        }, 1600);
      }

      /* ============================================================
         MODAL VINH DANH NGƯỜI TRÚNG
         ============================================================ */
      function showWinnerModal(winner, tier) {
        const modal = document.getElementById("winnerModalOverlay");
        const bannerImg = document.getElementById("modalPrizeBannerImg");
        const codeEl = document.getElementById("modalWinnerCode");
        const nameEl = document.getElementById("modalWinnerName");

        const tierInfo = PRIZE_CONFIG[tier] || { name: tier, banner: "" };

        if (bannerImg) {
          if (tierInfo.banner) {
            bannerImg.src = tierInfo.banner;
            bannerImg.parentElement.style.display = "block";
          } else {
            bannerImg.parentElement.style.display = "none";
          }
        }
        if (codeEl)
          codeEl.textContent = winner.id
            .toString()
            .padStart(DIGIT_COUNT, "0");
        if (nameEl) nameEl.textContent = (winner.name || "").toUpperCase();

        if (modal) modal.classList.add("is-visible");
      }

      function hideWinnerModal() {
        const modal = document.getElementById("winnerModalOverlay");
        if (modal) modal.classList.remove("is-visible");
      }

      function handleWinnerConfirm() {
        if (!currentWinnerCandidate) return;

        usedNumbers.push(currentWinnerCandidate.id);
        const record = {
          ...currentWinnerCandidate,
          tier: currentSelectedTier,
          timestamp: new Date().toISOString(),
        };
        sessionWinners.push(record);

        saveSessionState();
        updatePrizeCountsUI();
        hideWinnerModal();
        currentWinnerCandidate = null;
        updateControlButtonState("ready-next");
      }

      function handleWinnerAbsent() {
        if (!currentWinnerCandidate) return;

        if (!absentWinners.includes(currentWinnerCandidate.id)) {
          absentWinners.push(currentWinnerCandidate.id);
        }
        usedNumbers = usedNumbers.filter(
          (id) => id !== currentWinnerCandidate.id
        );

        saveSessionState();
        hideWinnerModal();
        currentWinnerCandidate = null;

        // Bỏ tự động quay tiếp! Đặt nút về trạng thái QUAY TIẾP để người điều khiển chủ động bấm
        updateControlButtonState("ready-next");
      }

      /* ============================================================
         LÀM MỚI PHIÊN QUAY
         ============================================================ */
      function handleResetSession() {
        if (isSpinning) return;
        const ok = confirm(
          "Bạn có chắc chắn muốn LÀM MỚI toàn bộ kết quả quay số của phiên này?"
        );
        if (!ok) return;

        usedNumbers = [];
        absentWinners = [];
        sessionWinners = [];
        sessionStorage.removeItem("msb_usedNumbers");
        sessionStorage.removeItem("msb_absentWinners");
        sessionStorage.removeItem("msb_winnersData");

        updatePrizeCountsUI();
        updateControlButtonState("initial");

        for (let i = 0; i < DIGIT_COUNT; i++) {
          const cell = document.getElementById(`slot-cell-${i}`);
          if (cell) {
            cell.classList.remove("is-spinning", "is-locked");
            cell.style.transform = "translate3d(0,0,0) rotateX(0deg)";
          }
          stripPositions[i] = 0;
          setStripTransform(i, 0);
        }
      }

      /* ============================================================
         QUẢN LÝ VIDEO NỀN DUY NHẤT & TỰ ĐỘNG PHÁT (BACKGROUND MP4)
         ============================================================ */
      const bgVideo = document.getElementById("bgVideo");
      if (bgVideo) {
        const attemptPlay = () => {
          const playPromise = bgVideo.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              // Bắt sự kiện người dùng chạm/click lần đầu nếu trình duyệt chặn autoplay
              window.addEventListener(
                "pointerdown",
                () => {
                  bgVideo.play();
                },
                { once: true }
              );
            });
          }
        };
        attemptPlay();
      }

      window.addEventListener("resize", () => {
        resizeCelebrationCanvas();
        initSlotStrips();
      });

      /* ============================================================
         PHÁO HOA SAO BĂNG ĂN MỪNG (CHỈ DÙNG CAM - ĐỎ MSB VÀ TRẮNG)
         ============================================================ */
      const celebrationCanvas = document.getElementById("celebrationCanvas");
      const celebrationCtx = celebrationCanvas.getContext("2d");
      let celebrationParticles = [];
      let celebrationShootingStars = [];
      let isCelebrationRunning = false;

      function resizeCelebrationCanvas() {
        celebrationCanvas.width = window.innerWidth;
        celebrationCanvas.height = window.innerHeight;
      }

      function triggerCelebration() {
        resizeCelebrationCanvas();
        celebrationParticles = [];
        celebrationShootingStars = [];

        // 8 vệt sao băng Cam và Đỏ Cam MSB
        for (let i = 0; i < 8; i++) {
          celebrationShootingStars.push({
            x: Math.random() * celebrationCanvas.width * 0.7,
            y: Math.random() * celebrationCanvas.height * 0.4,
            length: Math.random() * 130 + 80,
            speed: Math.random() * 16 + 18,
            angle: Math.PI / 4 + (Math.random() * 0.3 - 0.15),
            opacity: 1,
            color: i % 2 === 0 ? "#f37021" : "#ef4123",
          });
        }

        // 150 hạt ánh sáng Cam, Đỏ Cam, Đỏ Cờ và Trắng MSB (KHÔNG CÓ MÀU VÀNG)
        const centerX = celebrationCanvas.width / 2;
        const centerY = celebrationCanvas.height / 2;
        const colors = [
          "#f37021",
          "#ef4123",
          "#ed1c24",
          "#ffffff",
          "#ff8c5a",
          "#ffaa80",
        ];

        for (let i = 0; i < 150; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 14 + 4;
          celebrationParticles.push({
            x: centerX,
            y: centerY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2.5,
            size: Math.random() * 4.5 + 2,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1,
            gravity: 0.18,
            drag: 0.97,
            decay: Math.random() * 0.015 + 0.008,
          });
        }

        if (!isCelebrationRunning) {
          isCelebrationRunning = true;
          animateCelebration();
        }
      }

      function animateCelebration() {
        if (!isCelebrationRunning) return;
        celebrationCtx.clearRect(
          0,
          0,
          celebrationCanvas.width,
          celebrationCanvas.height
        );

        for (let i = celebrationShootingStars.length - 1; i >= 0; i--) {
          const ss = celebrationShootingStars[i];
          const tailX = ss.x - Math.cos(ss.angle) * ss.length;
          const tailY = ss.y - Math.sin(ss.angle) * ss.length;

          const grad = celebrationCtx.createLinearGradient(
            tailX,
            tailY,
            ss.x,
            ss.y
          );
          grad.addColorStop(0, "transparent");
          grad.addColorStop(1, ss.color);

          celebrationCtx.strokeStyle = grad;
          celebrationCtx.lineWidth = 2.5;
          celebrationCtx.beginPath();
          celebrationCtx.moveTo(tailX, tailY);
          celebrationCtx.lineTo(ss.x, ss.y);
          celebrationCtx.stroke();

          ss.x += Math.cos(ss.angle) * ss.speed;
          ss.y += Math.sin(ss.angle) * ss.speed;
          ss.opacity -= 0.015;

          if (ss.opacity <= 0) {
            celebrationShootingStars.splice(i, 1);
          }
        }

        for (let i = celebrationParticles.length - 1; i >= 0; i--) {
          const p = celebrationParticles[i];
          p.vx *= p.drag;
          p.vy *= p.drag;
          p.vy += p.gravity;
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            celebrationParticles.splice(i, 1);
            continue;
          }

          celebrationCtx.save();
          celebrationCtx.globalAlpha = p.alpha;
          celebrationCtx.fillStyle = p.color;
          celebrationCtx.shadowColor = p.color;
          celebrationCtx.shadowBlur = 8;
          celebrationCtx.beginPath();
          celebrationCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          celebrationCtx.fill();
          celebrationCtx.restore();
        }

        if (
          celebrationParticles.length > 0 ||
          celebrationShootingStars.length > 0
        ) {
          requestAnimationFrame(animateCelebration);
        } else {
          isCelebrationRunning = false;
        }
      }

      /* ============================================================
         KHỞI ĐỘNG TRANG
         ============================================================ */
      window.addEventListener("DOMContentLoaded", () => {
        resizeCelebrationCanvas();
        initSlotStrips();
        loadParticipantsData();
      });
    </script>
  </body>
</html>
