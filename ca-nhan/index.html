<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hành Tinh Số Cá Nhân - MSB</title>

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Khung bao toàn màn hình -->
  <main class="stage-wrapper">

    <!-- Sân khấu hiển thị tỷ lệ chuẩn màn hình LED 1535x576 -->
    <div class="stage" id="screenStage">

      <!-- KHỐI TIÊU ĐỀ BÊN TRÁI -->
      <header class="brand-heading">
        <p class="sub-title">Hành tinh số cá nhân</p>
        <div class="divider-line" aria-hidden="true"></div>
        <h1 class="main-title">
          <span>MSB</span>
          <span>DIGITAL</span>
          <span>BANK</span>
        </h1>
        <p class="sub-title">Vươn xa mọi hành trình</p>
      </header>

      <!-- KHỐI 4 THẺ TÍNH NĂNG BÊN PHẢI -->
      <section class="features-container" aria-label="Các giải pháp tính năng">

        <!-- Thẻ 1: Cá nhân hoá dịch vụ -->
        <a href="ca-nhan-hoa.html" class="feature-card card-personal" tabindex="0">
          <div class="card-header">
            <span class="icon-badge">
              <img src="images/icon-user.svg" alt="Cá nhân hoá" class="card-icon">
            </span>
            <span class="icon-badge arrow-badge">
              <img src="images/icon-arrow-up-right.svg" alt="Mở rộng" class="card-arrow">
            </span>
          </div>
          <div class="card-body">
            <h2 class="card-title"><span>Cá nhân hoá<br>dịch vụ</span></h2>
          </div>
        </a>

        <!-- Thẻ 2: Tối ưu tài chính -->
        <a href="toi-uu3.html" class="feature-card card-finance" tabindex="0">
          <div class="card-header">
            <span class="icon-badge">
              <img src="images/icon-finance.svg" alt="Tối ưu tài chính" class="card-icon">
            </span>
            <span class="icon-badge arrow-badge">
              <img src="images/icon-arrow-up-right.svg" alt="Mở rộng" class="card-arrow">
            </span>
          </div>
          <div class="card-body">
            <h2 class="card-title"><span>Tối ưu<br>tài chính</span></h2>
          </div>
        </a>

        <!-- Thẻ 3: Hiệu năng mạnh mẽ & An toàn bảo mật -->
        <a href="hieu-nang.html" class="feature-card card-security" tabindex="0">
          <div class="card-header">
            <span class="icon-badge">
              <img src="images/icon-security.svg" alt="Hiệu năng & Bảo mật" class="card-icon">
            </span>
            <span class="icon-badge arrow-badge">
              <img src="images/icon-arrow-up-right.svg" alt="Mở rộng" class="card-arrow">
            </span>
          </div>
          <div class="card-body">
            <h2 class="card-title"><span>Hiệu năng<br>mạnh mẽ &amp;<br>An toàn bảo mật</span></h2>
          </div>
        </a>

        <!-- Thẻ 4: Hệ sinh thái tiện ích All in One -->
        <a href="he-sinh-thai2.html" class="feature-card card-ecosystem" tabindex="0">
          <div class="card-header">
            <span class="icon-badge">
              <img src="images/icon-ecosystem.svg" alt="Hệ sinh thái" class="card-icon">
            </span>
            <span class="icon-badge arrow-badge">
              <img src="images/icon-arrow-up-right.svg" alt="Mở rộng" class="card-arrow">
            </span>
          </div>
          <div class="card-body">
            <h2 class="card-title"><span>Hệ sinh thái<br>tiện ích<br>All in One</span></h2>
          </div>
        </a>

    </div>
