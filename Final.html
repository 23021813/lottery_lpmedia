      rel="stylesheet"
    />
    <title>Quay Số Trúng Thưởng</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        -ms-box-sizing: border-box;
        text-rendering: optimizeLegibility;
      }
      .game-root {
        align-items: center;
        background-clip: initial;
        background-image: url(QUAYSO.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        color: #fff;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        justify-content: center;
        position: relative;
        width: 100%;
      }
      .header {
        text-align: center;
        margin-bottom: 60px;
      }
      .header h1 {
        color: #ba7c38;
        cursor: default;
        font-size: 80px;
        font-family: "Inter", serif;
        font-weight: 800;
        line-height: 1.2;
        margin-bottom: 10px;
        text-transform: uppercase;
      }
      #prizeSelect {
        font-size: 60px;
        text-align: center;
        background: none;
        border: 0;
        cursor: pointer;
        outline: 0;
        color: #ba7c38;
        font-family: "Inter", serif;
        font-weight: 800;
        -moz-appearance: none;
        -webkit-appearance: none;
        appearance: none;
      }
      #prizeSelect option {
        font-size: 20px;
        cursor: pointer;
      }
      .slot-machine {
        display: flex;
        width: 450px;
        margin-bottom: 30px;
        position: relative;
      }
      .slot-machine::before {
        width: 0;
        height: 0;
        border-top: 18px solid transparent;
        border-bottom: 18px solid transparent;
        border-right: 20px solid #ba7c38;
        position: absolute;
        top: 50%;
        left: -18px;
        margin-top: -18px;
        content: "";
      }
      .slot-machine::after {
        width: 0;
        height: 0;
        border-top: 18px solid transparent;
        border-bottom: 18px solid transparent;
        border-left: 20px solid #ba7c38;
        position: absolute;
        top: 50%;
        right: -18px;
        margin-top: -18px;
        content: "";
      }
      .slot {
        flex: 1;
        text-align: center;
        font-size: 120px;
        padding: 20px 20px;
        margin: 0 10px;
        background-color: #ba7c38;
        border-radius: 8px;
        color: #fff;
      }
      .slot:last-child {
        border-right: none;
      }
      .button {
        align-items: center;
        background-color: #ba7c38;
        border: 4px solid #ba7c38;
        border-radius: 30px;
        color: #fff;
        cursor: pointer;
        display: flex;
        font-size: 30px;
        font-weight: 700;
        height: 60px;
        justify-content: center;
        margin: 0 20px;
        min-width: 280px;
        opacity: 1;
        text-transform: uppercase;
      }
      .button:disabled {
        background-color: #ba7c38;
        cursor: not-allowed;
        opacity: 0.6;
      }
      .winners-list {
        margin: 40px 0;
        text-align: left;
        background: transparent;
        width: 850px;
        border-radius: 12px;
        padding: 25px;
        display: none;
        border: 2px solid #ba7c38;
        position: relative;
        animation: slideInUp 0.6s ease-out;
      }

      .winners-list h2 {
        text-align: center;
        color: #ba7c38;
        font-size: 28px;
        margin-bottom: 20px;
        font-family: "Inter", serif;
        font-weight: 800;
        position: relative;
        padding-bottom: 15px;
      }

      .winners-list h2::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 2px;
        background: #ba7c38;
        border-radius: 1px;
      }

      #winners {
        list-style-type: none;
        padding: 0;
      }

      #winners li {
        background: rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 15px;
        border: 1px solid rgba(186, 124, 56, 0.3);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        animation: fadeInUp 0.6s ease-out forwards;
        opacity: 1;
        transform: translateY(0);
      }

      #winners li::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: #ba7c38;
        border-radius: 0 4px 4px 0;
      }

      #winners li:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.95);
        border-color: rgba(186, 124, 56, 0.5);
      }

      #winners li:first-child {
        margin-top: 0;
      }

      #winners li:last-child {
        margin-bottom: 0;
        background: rgba(255, 240, 240, 0.9);
        border-color: #ff6666;
        animation: pulseGlow 2s ease-in-out infinite;
      }

      #winners li:last-child::before {
        background: #ff4444;
      }

      #winners li:last-child .winner-result {
        font-weight: bold;
        color: #ff4444;
        animation: textGlow 1s ease-in-out infinite alternate;
      }

      .winner-header {
        font-size: 20px;
        font-weight: 700;
        color: #ba7c38;
        margin-bottom: 12px;
        font-family: "Inter", serif;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .winner-details {
        font-size: 16px;
        line-height: 1.6;
        color: #333;
        padding-left: 10px;
      }

      .winner-details div {
        margin-bottom: 6px;
        padding: 4px 8px;
        background: rgba(186, 124, 56, 0.1);
        border-radius: 4px;
        border-left: 2px solid rgba(186, 124, 56, 0.4);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .winner-details div:hover {
        background: rgba(186, 124, 56, 0.15);
        transform: translateX(3px);
      }

      .winner-details strong {
        color: #ba7c38;
        font-weight: 600;
        min-width: 70px;
        display: inline-block;
      }

      .winner-id {
        color: #ba7c38;
        font-weight: 800;
        font-size: 22px;
      }

      /* Animations */
      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulseGlow {
        0%,
        100% {
          border-color: #ff6666;
        }
        50% {
          border-color: #ff4444;
        }
      }

      @keyframes textGlow {
        0% {
          color: #ff4444;
        }
        100% {
          color: #ff6666;
        }
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-5px);
        }
        60% {
          transform: translateY(-3px);
        }
      }
      @-webkit-keyframes my {
        0% {
          color: #b80000;
        }
        50% {
          color: #fff;
        }
        100% {
          color: #b80000;
        }
      }
      @-moz-keyframes my {
        0% {
          color: #b80000;
        }
        50% {
          color: #fff;
        }
        100% {
          color: #b80000;
        }
      }
      @-o-keyframes my {
        0% {
          color: #b80000;
        }
        50% {
          color: #fff;
        }
        100% {
          color: #b80000;
        }
      }
      @keyframes my {
        0% {
          color: #b80000;
        }
        50% {
          color: #fff;
        }
        100% {
          color: #b80000;
        }
      }

            const line = lines[i].trim();

              if (columns.length >= 6) {

                });

            console.log("Loaded usedNumbers:", usedNumbers);
          }

          setTimeout(() => {

            if (savedWinnersDetails) {

              const winnersDetails = JSON.parse(savedWinnersDetails);

      function updateParticipantCount() {
        const availableCount = participants.filter(
          (p) => !usedNumbers.includes(p.id) && !p.prizeWon
        ).length;
        document.getElementById(
          "participantCount"
        ).innerText = `Tổng số người tham gia: ${participants.length} | Còn lại: ${availableCount}`;
      }

      // Parse CSV line với xử lý dấu phẩy trong quotes
      function parseCSVLine(line) {
        const result = [];
        let current = "";
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === "," && !inQuotes) {
            result.push(current);
            current = "";
          } else {
            current += char;
          }
        }
        result.push(current);
        return result;
      }

      function getRandomNumber() {
        if (participants.length === 0) return Math.floor(Math.random() * 10);
        const randomParticipant =
          participants[Math.floor(Math.random() * participants.length)];
        return randomParticipant.id.toString().slice(-1); // Lấy chữ số cuối của ID
      }

      function getValidNumber() {
        if (participants.length === 0) {
          alert("Chưa load được dữ liệu người tham gia!");
          return null;
        }

        // Lọc những người chưa trúng giải
        const availableParticipants = participants.filter(
          (p) => !usedNumbers.includes(p.id) && !p.prizeWon
        );

        if (availableParticipants.length === 0) {
          alert("Đã hết người tham gia chưa trúng giải!");
          return null;
        }

        // Chọn ngẫu nhiên một người từ danh sách còn lại
        const randomIndex = Math.floor(
          Math.random() * availableParticipants.length
        );
        const selectedParticipant = availableParticipants[randomIndex];

        return selectedParticipant.id;
      }

        const winnersList = document.getElementById("winners");
        const winnersListElement = document.querySelector(".winners-list");

        // Clear existing list first
        winnersList.innerHTML = "";

        // Sắp xếp theo thứ tự giải
        const sortedWinners = sortWinnersByPrize([...winnersDetails]);

                <div><strong>👤 Họ & Tên:</strong> ${winner.name}</div>
                <div><strong>📱 Điện thoại:</strong> ${maskNumber(winner.phone)}</div>
                <div><strong>🆔 CCCD:</strong> ${maskNumber(winner.nationalId)}</div>
                <div><strong>🏢 Đại lý:</strong> ${winner.agency}</div>
            </div>
          `;
          winnersList.appendChild(listItem);
        });

        if (winnersDetails.length > 0) {
          winnersListElement.style.setProperty("display", "block", "important");
          winnersListElement.style.animation = "slideInUp 0.6s ease-out";
          console.log(
            "Winners list displayed with",
            winnersDetails.length,
            "items"
          );
        }
      }

      // Tái tạo winnersDetails từ usedNumbers nếu bị mất
      function recreateWinnersDetails() {
        if (
          usedNumbers.length > 0 &&
          !sessionStorage.getItem("winnersDetails")
        ) {
          console.log("Recreating winners details from usedNumbers...");
          const winnersDetails = [];

          usedNumbers.forEach((id, index) => {
            const participant = participants.find((p) => p.id === id);
            if (participant) {
              winnersDetails.push({
                id: id.toString().padStart(3, "0"),
                prize:
                  ["🥇 GIẢI NHẤT", "🥈 GIẢI NHÌ", "🥉 GIẢI BA", "🎫 MÃ SỐ"][
                    index
                  ] || `🎫 MÃ SỐ ${index + 1}`, // Fallback prize name
                name: participant.name,
                phone: participant.phone,
                nationalId: participant.nationalId,
                agency: participant.agency,
              });
            }
          });

          sessionStorage.setItem(
            "winnersDetails",
            JSON.stringify(winnersDetails)
          );
          displaySavedWinners(winnersDetails);
        }
      }

      // Debug functions
      function clearSessionData() {
        sessionStorage.removeItem("usedNumbers");
        sessionStorage.removeItem("winnersDetails");
        location.reload();
      }

      function showSessionData() {
        const usedNumbers = sessionStorage.getItem("usedNumbers");
        const winnersDetails = sessionStorage.getItem("winnersDetails");
        console.log("UsedNumbers:", usedNumbers);
        console.log("WinnersDetails:", winnersDetails);
        alert(`UsedNumbers: ${usedNumbers}\nWinnersDetails: ${winnersDetails}`);
      }

      // Load dữ liệu khi trang được tải
      window.addEventListener("load", async () => {
        await loadParticipants();
      });

      document
        .getElementById("prizeSelect")
        .addEventListener("change", function () {
          document.getElementById("spinButton").disabled =
            this.value === "none";
        });

      function toggleSpin() {
        const button = document.getElementById("spinButton");
        if (!spinning) {
          spinning = true;
          isStopping = false;
          button.innerText = "Xem kết quả";
          startSpinning();
        } else if (!isStopping) {
          isStopping = true;
          button.disabled = true;
          stopSpinningGradually();
        }
      }

      function startSpinning() {
        const slots = document.querySelectorAll(".slot");
        intervals = [];

        slots.forEach((slot, index) => {
          const interval = setInterval(() => {
            if (participants.length > 0) {
              // Hiển thị ID ngẫu nhiên từ danh sách người tham gia
              const randomParticipant =
                participants[Math.floor(Math.random() * participants.length)];
              const idStr = randomParticipant.id.toString().padStart(3, "0");
              slot.innerText = idStr[index] || "0";
            } else {
              slot.innerText = Math.floor(Math.random() * 10);
            }
          }, 50);
          intervals.push(interval);
        });
      }

      function formatNumber(number) {
        return number.toString().padStart(3, "0");
      }

      function stopSpinningGradually() {
        const slots = document.querySelectorAll(".slot");
        let stopDelay = 0;
        const validNumber = getValidNumber();

        if (validNumber === null) return; // Không có số hợp lệ

        const result = formatNumber(validNumber);
        const resultArray = result.split("");

        // Thêm slot thứ 4 nếu cần (để hiển thị đủ 3 chữ số)
        while (resultArray.length < 3) {
          resultArray.unshift("0");
        }

        slots.forEach((slot, index) => {
          setTimeout(() => {
            clearInterval(intervals[index]);
            if (index < resultArray.length) {
              slot.innerText = resultArray[index];
            } else {
              slot.innerText = "0";
            }
            if (index === slots.length - 1) {
              setTimeout(() => {
                usedNumbers.push(validNumber); // Thêm vào danh sách đã dùng
                // Lưu vào session storage
                sessionStorage.setItem(
                  "usedNumbers",
                  JSON.stringify(usedNumbers)
                );

                addWinner(validNumber);
                updateParticipantCount(); // Cập nhật số lượng người còn lại
                spinning = false;
                isStopping = false;
                document.getElementById("spinButton").innerText = "Quay Ngay";
                document.getElementById("spinButton").disabled = false;
              }, 500);
            }
          }, stopDelay);
          stopDelay += 1500;
        });
      }

      // Mapping tên giải
      const prizeMapping = {
        "Giải Nhất": "🥇 GIẢI NHẤT",
        "Giải Nhì": "🥈 GIẢI NHÌ",
        "Giải Ba": "🥉 GIẢI BA",
        "Mã số": "🎫 MÃ SỐ",
      };

      // Thứ tự ưu tiên giải thưởng
      const prizeOrder = {
        "🥇 GIẢI NHẤT": 1,
        "🥈 GIẢI NHÌ": 2,
        "🥉 GIẢI BA": 3,
        "🎫 MÃ SỐ": 4,
      };

      // Sắp xếp danh sách winners theo thứ tự giải
      function sortWinnersByPrize(winners) {
        return winners.sort((a, b) => {
          const orderA = prizeOrder[a.prize] || 999;
          const orderB = prizeOrder[b.prize] || 999;
          return orderA - orderB;
        });
      }

      // Hàm để chỉ hiển thị 4 số cuối
      function maskNumber(number) {
        if (!number || number.length <= 4) return number;
        return '***' + number.slice(-4);
      }

      function addWinner(participantId) {
        const prizeValue = document.getElementById("prizeSelect").value;
        const prize = prizeMapping[prizeValue] || prizeValue;
        const winnersList = document.getElementById("winners");

        // Tìm thông tin người tham gia
        const participant = participants.find((p) => p.id === participantId);

        if (participant) {
          const formattedId = participantId.toString().padStart(3, "0");

          // Lưu thông tin winner vào session storage
          const savedWinnersDetails = sessionStorage.getItem("winnersDetails");
          let winnersDetails = savedWinnersDetails
            ? JSON.parse(savedWinnersDetails)
            : [];

          const winnerData = {
            id: formattedId,
            prize: prize,
            name: participant.name,
            phone: participant.phone,
            nationalId: participant.nationalId,
            agency: participant.agency,
          };

          winnersDetails.push(winnerData);

          console.log("Saving winner data:", winnerData);
          console.log("All winners details:", winnersDetails);

          sessionStorage.setItem(
            "winnersDetails",
            JSON.stringify(winnersDetails)
          );

          // Sắp xếp lại và hiển thị toàn bộ danh sách
          const sortedWinners = sortWinnersByPrize(winnersDetails);

          // Clear và hiển thị lại danh sách đã sắp xếp
          winnersList.innerHTML = "";
          sortedWinners.forEach((winner, index) => {
            const sortedItem = document.createElement("li");

            sortedItem.innerHTML = `
              <div class="winner-header">
                  <span class="winner-result">${winner.prize}: <span class="winner-id">${winner.id}</span></span>
              </div>
              <div class="winner-details">
                    <div><strong>👤 Họ & Tên:</strong> ${winner.name}</div>
                    <div><strong>📱 Điện thoại:</strong> ${maskNumber(winner.phone)}</div>
                    <div><strong>🆔 CCCD:</strong> ${maskNumber(winner.nationalId)}</div>
                    <div><strong>🏢 Đại lý:</strong> ${winner.agency}</div>
              </div>
            `;
            winnersList.appendChild(sortedItem);
          });

          // Hiển thị danh sách trúng giải với animation
          const winnersListElement = document.querySelector(".winners-list");

          // Force hiển thị với timeout để đảm bảo DOM đã update
          setTimeout(() => {
            winnersListElement.style.setProperty(
              "display",
              "block",
              "important"
            );
            winnersListElement.style.animation = "slideInUp 0.6s ease-out";
            console.log("Winners list displayed");
          }, 100);
        }
      }
    </script>
  </body>
</html>
