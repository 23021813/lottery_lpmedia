<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tối Ưu Tài Chính - MSB</title>

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Khung bao toàn màn hình -->
  <main class="stage-wrapper">

    <!-- Sân khấu hiển thị tỷ lệ chuẩn màn hình LED 1535x576 -->
    <div class="stage stage-detail" id="screenStage">

      <!-- KHỐI TIÊU ĐỀ BÊN TRÊN Ở GIỮA -->
      <header class="detail-heading">
        <h1 class="main-title">
          <span>TỐI ƯU TÀI CHÍNH</span>
        </h1>
        <div class="divider-line" aria-hidden="true"></div>
        <p class="sub-title">Tối đa hóa lợi ích từ các sản phẩm tài chính</p>
      </header>

      <!-- KHỐI 2 CỘT TÍNH NĂNG Ở GIỮA -->
      <section class="detail-cards-container dual-column-container" aria-label="Tối ưu tài chính">

        <!-- Cột 1: M-Sinh lời -->
        <div class="feature-column">
          <article class="detail-card" tabindex="0" onclick="window.location.href='toi-uu1.html'">
            <div class="detail-card-icon">
              <img src="images/icon-dongtien-3d.png" alt="Tối ưu dòng tiền" class="img-icon-3d">
            </div>
            <div class="detail-card-body">
              <p class="detail-card-desc">
                <span>Tối ưu dòng tiền nhàn rỗi</span><br>
                <span>của khách hàng giúp KH</span><br>
                <span>sinh lời không ngừng</span>
              </p>
            </div>
          </article>
          <div class="column-action">
            <div class="chevron-indicator" aria-hidden="true">
              <img src="images/icon-chevron-down.svg" alt="" class="icon-down">
            </div>
            <a href="toi-uu1.html" class="btn-cta" role="button">
              M-Sinh lời
            </a>
          </div>
        </div>

        <!-- Cột 2: M-Triple -->
        <div class="feature-column">
          <article class="detail-card" tabindex="0" onclick="window.location.href='toi-uu2.html'">
            <div class="detail-card-icon">
              <img src="images/icon-giaiphao-3d.png" alt="Giải pháp tín dụng" class="img-icon-3d">
            </div>
            <div class="detail-card-body">
              <p class="detail-card-desc">
                <span>Mang đến trọn bộ</span><br>
                <span>giải pháp tín dụng, hành trình</span><br>
                <span>được 100% số hóa</span><br>
                <span>trên MSB Digital Bank</span>
              </p>
            </div>
          </article>
          <div class="column-action">
            <div class="chevron-indicator" aria-hidden="true">
              <img src="images/icon-chevron-down.svg" alt="" class="icon-down">
            </div>
            <a href="toi-uu2.html" class="btn-cta" role="button">
              M-Triple
            </a>
          </div>
        </div>

      </section>

    </div>

  </main>

</body>

</html>
