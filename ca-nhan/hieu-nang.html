<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiệu Năng Mạnh Mẽ & An Toàn Bảo Mật - MSB</title>

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Khung bao toàn màn hình -->
  <main class="stage-wrapper">

    <!-- Sân khấu hiển thị tỷ lệ chuẩn màn hình LED 1535x576 -->
    <div class="stage stage-detail" id="screenStage">

      <!-- KHỐI TIÊU ĐỀ BÊN TRÊN Ở GIỮA -->
      <header class="detail-heading ecosystem-heading">
        <h1 class="main-title">
          <span>HIỆU NĂNG MẠNH MẼ</span>
          <span>&amp; AN TOÀN BẢO MẬT</span>
        </h1>
        <div class="divider-line" aria-hidden="true"></div>
      </header>

      <!-- KHỐI 3 CỘT TÍNH NĂNG Ở GIỮA -->
      <section class="detail-cards-container dual-column-container" aria-label="Hiệu năng mạnh mẽ & An toàn bảo mật">

        <!-- Cột 1: Bảo vệ đa lớp -->
        <div class="feature-column">
          <article class="detail-card" tabindex="0">
            <div class="detail-card-icon">
              <img src="images/icon-security-3d.png" alt="Bảo vệ đa lớp" class="img-icon-3d">
            </div>
            <div class="detail-card-body">
              <p class="detail-card-desc">
                <span>Bảo vệ đa lớp</span>
              </p>
            </div>
          </article>
        </div>

        <!-- Cột 2: Chủ động cảnh báo -->
        <div class="feature-column">
          <article class="detail-card" tabindex="0">
            <div class="detail-card-icon">
              <img src="images/icon-notifi-3d.png" alt="Chủ động cảnh báo" class="img-icon-3d">
            </div>
            <div class="detail-card-body">
              <p class="detail-card-desc">
                <span>Chủ động cảnh báo</span>
              </p>
            </div>
          </article>
        </div>

        <!-- Cột 3: Xác thực nâng cao -->
        <div class="feature-column">
          <article class="detail-card" tabindex="0">
            <div class="detail-card-icon">
              <img src="images/icon-check-3d.png" alt="Xác thực nâng cao" class="img-icon-3d">
            </div>
            <div class="detail-card-body">
              <p class="detail-card-desc">
                <span>Xác thực nâng cao thông qua</span><br>
                <span>câu hỏi bảo mật</span>
              </p>
            </div>
          </article>
        </div>

      </section>

      <!-- KHỐI ĐIỀU HƯỚNG & NÚT BẤM DƯỚI CÙNG -->
      <footer class="detail-action-container">
        <div class="chevron-indicator" aria-hidden="true">
          <img src="images/icon-chevron-down.svg" alt="" class="icon-down">
        </div>
        <a href="#" class="btn-cta" role="button">
          Trung tâm bảo mật
        </a>
      </footer>

    </div>

  </main>

</body>

</html>
