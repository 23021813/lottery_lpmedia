<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Triple - Tối Ưu Tài Chính - MSB</title>

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Khung bao toàn màn hình -->
  <main class="stage-wrapper">

    <!-- Sân khấu hiển thị tỷ lệ chuẩn màn hình LED 1535x576 -->
    <div class="stage stage-rewards" id="screenStage">

      <!-- KHỐI TIÊU ĐỀ BÊN TRÊN Ở GIỮA -->
      <header class="detail-heading rewards-heading">
        <h1 class="main-title">
          <span>M-TRIPLE</span>
        </h1>
        <div class="divider-line" aria-hidden="true"></div>
        <p class="sub-title2">
          Giải pháp combo vay tín chấp - thấu chi - thẻ tín dụng online<br>
          nhanh gọn, tiện lợi, và an toàn
        </p>
      </header>

      <!-- KHỐI 3 THẺ TÍNH NĂNG Ở GIỮA -->
      <section class="rewards-cards-container" aria-label="Lợi ích combo M-Triple">

        <!-- Thẻ 1 -->
        <article class="rewards-card" tabindex="0">
          <div class="rewards-card-num">1</div>
          <div class="rewards-card-body">
            <p class="rewards-card-desc">
              Phê duyệt<br>
              Nhanh chóng<br>
              online
            </p>
          </div>
        </article>

        <!-- Thẻ 2 -->
        <article class="rewards-card" tabindex="0">
          <div class="rewards-card-num">2</div>
          <div class="rewards-card-body">
            <p class="rewards-card-desc">
              Linh hoạt<br>
              lựa chọn hạn mức<br>
              cho từng sản phẩm vay
            </p>
          </div>
        </article>

        <!-- Thẻ 3 -->
        <article class="rewards-card" tabindex="0">
          <div class="rewards-card-num">3</div>
          <div class="rewards-card-body">
            <p class="rewards-card-desc">
              Tích hợp ký số<br>
              đảm bảo về bảo mật<br>
              và pháp lý
            </p>
          </div>
        </article>

      </section>

      <!-- KHỐI ĐIỀU HƯỚNG & MÔ HÌNH ĐIỆN THOẠI DƯỚI CÙNG -->
      <footer class="rewards-action-container">
        <div class="chevron-indicator" aria-hidden="true">
          <img src="images/icon-chevron-down.svg" alt="" class="icon-down">
        </div>
        <span class="rewards-action-label">TRẢI NGHIỆM NGAY</span>
        <div class="phone-mockup-wrapper">
          <img src="images/phone_mockup.png" alt="Trải nghiệm ứng dụng MSB" class="img-phone-mockup">
        </div>
      </footer>

    </div>

  </main>

</body>

</html>
