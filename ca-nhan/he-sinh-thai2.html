<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Sinh Thái Tiện Ích All In One - MSB</title>

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Khung bao toàn màn hình -->
  <main class="stage-wrapper">

    <!-- Sân khấu hiển thị tỷ lệ chuẩn màn hình LED 1535x576 -->
    <div class="stage stage-detail" id="screenStage">

      <!-- KHỐI TIÊU ĐỀ BÊN TRÊN Ở GIỮA -->
      <header class="detail-heading ecosystem-heading">
        <h1 class="main-title">
          <span>HỆ SINH THÁI TIỆN ÍCH</span>
          <span>ALL IN ONE</span>
        </h1>
        <div class="divider-line" aria-hidden="true"></div>
      </header>

      <!-- KHỐI 2 CỘT TÍNH NĂNG Ở GIỮA (KẾ THỪA TỪ CA-NHAN-HOA) -->
      <section class="detail-cards-container dual-column-container" aria-label="Hệ sinh thái tiện ích All in One">

        <!-- Cột 1: MSB Rewards -->
        <div class="feature-column">
          <article class="detail-card" tabindex="0" onclick="window.location.href='he-sinh-thai1.html'">
            <div class="detail-card-icon">
              <img src="images/icon-star-3d.png" alt="Tích điểm dễ dàng" class="img-icon-3d">
            </div>
            <div class="detail-card-body">
              <p class="detail-card-desc">
                <span>Tích điểm dễ dàng,</span><br>
                <span>tận hưởng lợi ích thiết thực</span>
              </p>
            </div>
          </article>
          <div class="column-action">
            <div class="chevron-indicator" aria-hidden="true">
              <img src="images/icon-chevron-down.svg" alt="" class="icon-down">
            </div>
            <a href="he-sinh-thai1.html" class="btn-cta" role="button">
              MSB Rewards
            </a>
          </div>
        </div>

        <!-- Cột 2: Marketplace -->
        <div class="feature-column">
          <article class="detail-card" tabindex="0">
            <div class="detail-card-icon">
              <img src="images/icon-hub-3d.png" alt="Kết nối hệ sinh thái tiện ích" class="img-icon-3d">
            </div>
            <div class="detail-card-body">
              <p class="detail-card-desc">
                <span>Kết nối hệ sinh thái tiện ích</span><br>
                <span>ngay trên DigiBank</span>
              </p>
            </div>
          </article>
          <div class="column-action">
            <div class="chevron-indicator" aria-hidden="true">
              <img src="images/icon-chevron-down.svg" alt="" class="icon-down">
            </div>
            <a href="#" class="btn-cta" role="button">
              Marketplace
            </a>
          </div>
        </div>

      </section>

      <a href="javascript:;" class="btn-back">
        <img src="images/icon-back.png" alt="Back" class="img-back">
      </a>

    </div>

  </main>

</body>

</html>
